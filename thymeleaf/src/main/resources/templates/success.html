<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登陆成功</title>
    <style>
        h1, h2 {
            display: inline;
        }
    </style>
</head>
<body>
<!--th:utext与th:text区别:th:utext可以解析html代码-->
<h1>欢迎您！用户<span th:utext="${username}"></span></h1>
<br>
<h2 th:style="'color:red;font-weight:bold;'">你的信息如下：</h2>
<br>
用户名:<h2 th:text="${username}"></h2>
<br>
密码:<h2 th:text="${password}"></h2>
<br>
爱好:<h2>
    <span th:text="${param.hobby[0]}"></span>
    <span th:text="${param.hobby[1]}"></span>
</h2>
<br>


<!--公共内置域对象-->
<!--<p th:text="${#strings.toUpperCase(param.username)}"></p>-->

<!--Thymeleaf中@{/}中的/表示上下文路径-->
<a th:href="@{/login}">返回登录页面</a><br>

<a th:if="${#lists.isEmpty(param.hobby)}">hobby为空</a><br>
<a th:unless="${#lists.isEmpty(param.hobby)}">hobby不为空</a><br>

<ul th:each="hobby,status:${param.hobby}">
    <li th:text="${hobby}"></li>
</ul>
</body>
</html>
